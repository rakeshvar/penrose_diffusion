#---------------------------------------------------------
# Training
#---------------------------------------------------------
default_train: &default_train
  lr: 0.001
  batch_size: 64
  num_epochs: 100
  save_samples: true

#---------------------------------------------------------
# WandB
#---------------------------------------------------------
default_wandb: &default_wandb
  enable: true
  project: 'penrose-train'
  run_name: null        # Auto-generated if null
  run_id: null          # Specify to resume a specific run
  watch_freq: 0         # Frequency to log gradients and parameters

verbose_wandb:
  <<: *default_wandb
  enable: true
  project: 'penrose-debug'
  watch_freq: 10

no_wandb:
  <<: *default_wandb
  enable: false

nowatch_wandb:
  <<: *default_wandb
  enable: true
  watch_freq: 0

# ---------------------------------------------------------
# direct model
# ---------------------------------------------------------
directcommon: &directcommon
  model: "direct"
  num_classes: 70
  loss: "Noise"

direct32: &direct32
  <<: *directcommon
  class_embed_dim: 8
  time_embed_dim: 16
  d_model: 32
  num_heads: 4
  num_layers: 2
  dropout: 0.

direct64: &direct64
  <<: *directcommon
  class_embed_dim: 16
  time_embed_dim: 32
  d_model: 64
  num_heads: 4
  num_layers: 4
  dropout: 0.1

direct128: &direct128
  <<: *directcommon
  class_embed_dim: 32
  time_embed_dim: 64
  d_model: 128
  num_heads: 8
  num_layers: 4
  dropout: 0.1

direct256: &direct256
  <<: *directcommon
  class_embed_dim: 64
  time_embed_dim: 128
  d_model: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.2

#----------------------------------------------------------------
# Latent
#----------------------------------------------------------------
latentcommon: &latentcommon
  model: "latent"
  num_classes: 70
  rec_loss: "sinkhorn"

latent32: &latent32
  <<: *latentcommon
  latent_dim: 32

latent64: &latent64
  <<: *latentcommon
  latent_dim: 64

latent128: &latent128
  <<: *latentcommon
  latent_dim: 128

latent256: &latent256
  <<: *latentcommon
  latent_dim: 256

# ----------------------------------------------------------------
# EXPERIMENT GROUPS
# This is what you select via CLI (e.g., train.py data.npz toy)
# ----------------------------------------------------------------
default:
  model:
    <<: *direct64
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

ddtoy:
  model:
    <<: *direct32
  train:
    <<: *default_train
    num_epochs: 3
  wandb:
    <<: *default_wandb
    enable: true
    project: 'penrose-toy'

dd32:
  model:
    <<: *direct32
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

dd64:
  model:
    <<: *direct64
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

dd128:
  model:
    <<: *direct128
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

dd256:
  model:
    <<: *direct256
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

#----------------------------------------------------------------
# EXPERIMENT GROUPS
# This is what you select via CLI (e.g., train.py data.npz toy)
#----------------------------------------------------------------
ldtoy:
  model:
    <<: *latent32
  train:
    <<: *default_train
    num_epochs: 3
  wandb:
    <<: *default_wandb
    enable: true
    project: 'penrose-toy'

d32:
  model:
    <<: *latent32
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

d64:
  model:
    <<: *latent64
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

d128:
  model:
    <<: *latent128
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb

d256:
  model:
    <<: *latent256
  train:
    <<: *default_train
  wandb:
    <<: *default_wandb
