#---------------
# Common
#---------------
_directcommon: &directcommon
  wandb:
    <<: *default_wandb
    project: 'penrose-direct'
    enable: true
  train:
    <<: *default_train

#---------------
# Direct Models
#---------------
_dmc: &dmc
  model: "direct"
  diffuser: "ddpm"
  loss: "shl"
  margin_lambda: 0.0     # Stability-margin penalty weight (0 = off); paper suggests 0.02-0.05
  margin_prior_dim: 8    # Dimension of the attention-prior space

_dm32: &dm32
  class_embed_dim: 8
  time_embed_dim: 16
  d_model: 32
  num_heads: 4
  num_layers: 2
  dropout: 0.

_dm64: &dm64
  class_embed_dim: 16
  time_embed_dim: 32
  d_model: 64
  num_heads: 4
  num_layers: 4
  dropout: 0.1

_dm128: &dm128
  class_embed_dim: 32
  time_embed_dim: 64
  d_model: 128
  num_heads: 8
  num_layers: 4
  dropout: 0.1

_dm256: &dm256
  class_embed_dim: 64
  time_embed_dim: 128
  d_model: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.2

_dm512: &dm512
  class_embed_dim: 128
  time_embed_dim: 256
  d_model: 512
  num_heads: 16
  num_layers: 8
  dropout: 0.2

#---------------
# Configs
#---------------
dd32:
  <<: *directcommon
  model:
    <<: *dmc
    <<: *dm32

dd64:
  <<: *directcommon
  model:
    <<: *dmc
    <<: *dm64

dd128:
  <<: *directcommon
  model:
    <<: *dmc
    <<: *dm128

dd256:
  <<: *directcommon
  model:
    <<: *dmc
    <<: *dm256

dd512:
  <<: *directcommon
  model:
    <<: *dmc
    <<: *dm512
