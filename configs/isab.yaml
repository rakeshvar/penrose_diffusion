
#---------------
# ISAB
#---------------
_isabcommon: &isabcommon
  wandb:
    <<: *default_wandb
    project: 'penrose-isab'
    enable: true
  train:
    <<: *default_train

_ismc: &ismc
  model: "isab"
  diffuser: "ddpm"
  loss: "shl"
  margin_lambda: 0.0     # Stability-margin penalty weight (0 = off); paper suggests 0.02-0.05
  margin_prior_dim: 8    # Dimension of the attention-prior space

is32:
  <<: *isabcommon
  model:
    <<: *ismc
    <<: *dm32

is64:
  <<: *isabcommon
  model:
    <<: *ismc
    <<: *dm64

is128:
  <<: *isabcommon
  model:
    <<: *ismc
    <<: *dm128

is256:
  <<: *isabcommon
  model:
    <<: *ismc
    <<: *dm256
